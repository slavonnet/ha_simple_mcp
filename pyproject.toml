[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-simple-mcp"
version = "0.1.0"
description = "Reusable MCP core with Home Assistant HACS adapter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/slavonnet/ha_simple_mcp"
Repository = "https://github.com/slavonnet/ha_simple_mcp"
Issues = "https://github.com/slavonnet/ha_simple_mcp/issues"

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "tests",
]
addopts = "--cov=src/ha_simple_mcp --cov-report=term-missing --cov-fail-under=100"
markers = [
  "install: tests requiring docker and live install checks",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "A", "RUF"]
