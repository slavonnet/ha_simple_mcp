[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-simple-mcp"
version = "0.1.1"
description = "Home Assistant HACS adapter for external ha-api-mcp package."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10.0",
  "ha-api-mcp @ git+https://github.com/slavonnet/ha-api-mcp.git@v0.1.1",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/slavonnet/ha_simple_mcp"
Repository = "https://github.com/slavonnet/ha_simple_mcp"
Issues = "https://github.com/slavonnet/ha_simple_mcp/issues"

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "tests",
]
addopts = "--cov=custom_components --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = [
  "install: tests requiring docker and live install checks",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "A", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "custom_components.ha_simple_mcp",
  "custom_components.ha_simple_mcp.*",
]
ignore_missing_imports = true
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = [
  "homeassistant",
  "homeassistant.*",
  "voluptuous",
  "ha_api_mcp",
  "ha_api_mcp.*",
]
ignore_missing_imports = true
