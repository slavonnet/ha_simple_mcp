services:
  homeassistant:
    build:
      context: ../..
      dockerfile: tests/install/Dockerfile
    image: ha-simple-mcp-test:local
    restart: "no"
    network_mode: bridge
    ports:
      - "${HA_HOST_PORT:-18123}:8123"
    volumes:
      - ha_simple_mcp_config:/config

volumes:
  ha_simple_mcp_config:
