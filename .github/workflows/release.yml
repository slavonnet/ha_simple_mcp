name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish asset for (e.g. v0.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate version consistency for release tag
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path

          import tomllib

          release_tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", release_tag):
              raise SystemExit(f"Unsupported tag format: {release_tag}")

          tag_version = release_tag.removeprefix("v")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = pyproject["project"]
          dynamic_versions = set(project.get("dynamic", []))
          scm_config = pyproject.get("tool", {}).get("setuptools_scm")
          if "version" not in dynamic_versions:
              raise SystemExit(
                  "pyproject must use dynamic package version from git tags via project.dynamic"
              )
          if "version" in project:
              raise SystemExit(
                  "project.version must be omitted when dynamic versioning is enabled"
              )
          if not isinstance(scm_config, dict):
              raise SystemExit("tool.setuptools_scm config is required for dynamic tag versions")

          manifest = json.loads(
              Path("custom_components/ha_simple_mcp/manifest.json").read_text(encoding="utf-8")
          )
          manifest_version = manifest["version"]

          if manifest_version != tag_version:
              raise SystemExit(
                  f"manifest version '{manifest_version}' does not match tag '{tag_version}'"
              )
          PY

  build-release-archive:
    runs-on: ubuntu-latest
    needs:
      - validate-version
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Build HACS release archive
        run: |
          mkdir -p dist
          cd custom_components
          zip -r "../dist/ha_simple_mcp.zip" "ha_simple_mcp"

      - name: Publish HACS archive as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/ha_simple_mcp.zip
          generate_release_notes: true
          append_body: true
