name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish asset for (e.g. v0.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize release tag input
        run: |
          if [[ "${RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}"
          elif [[ "${RELEASE_TAG}" =~ ^v\.([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}"
            echo "::warning::Tag '${RELEASE_TAG}' uses legacy malformed format 'v.X.Y.Z'."
            echo "::warning::Prefer creating tags as 'vX.Y.Z'."
          elif [[ "${RELEASE_TAG}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}"
            RELEASE_TAG="v${RELEASE_VERSION}"
            echo "Normalized release tag to '${RELEASE_TAG}'"
          else
            echo "::error::Unsupported tag format '${RELEASE_TAG}'."
            echo "::error::Use tag format vX.Y.Z or X.Y.Z (example: v1.1.1)."
            exit 1
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Ensure requested release tag exists
        run: |
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git fetch --tags origin
          fi
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Tag '${RELEASE_TAG}' not found in origin."
            echo "::error::Create/push the tag first or select an existing tag in Run workflow."
            exit 1
          fi

      - name: Checkout requested release tag
        run: |
          git checkout --force "refs/tags/${RELEASE_TAG}"

      - name: Sync release files from tag version
        run: |
          python scripts/release_bump.py "${RELEASE_VERSION}"

      - name: Validate version consistency for release tag
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path

          import tomllib

          release_tag = os.environ["RELEASE_TAG"]
          tag_version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"v\.?\d+\.\d+\.\d+", release_tag):
              raise SystemExit(f"Unsupported normalized tag format: {release_tag}")
          if release_tag.removeprefix("v").lstrip(".") != tag_version:
              raise SystemExit(
                  f"RELEASE_TAG '{release_tag}' and RELEASE_VERSION '{tag_version}' are inconsistent"
              )
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = pyproject["project"]
          dynamic_version_enabled = "version" in project.get("dynamic", [])
          project_version = project.get("version")
          if dynamic_version_enabled:
              if "version" in project:
                  raise SystemExit(
                      "project.version must be omitted when dynamic versioning is enabled"
                  )
              scm_config = pyproject.get("tool", {}).get("setuptools_scm")
              if not isinstance(scm_config, dict):
                  raise SystemExit(
                      "tool.setuptools_scm config is required for dynamic tag versions"
                  )
          elif project_version != tag_version:
              raise SystemExit(
                  f"pyproject version '{project_version}' does not match tag '{tag_version}'"
              )

          manifest = json.loads(
              Path("custom_components/ha_simple_mcp/manifest.json").read_text(encoding="utf-8")
          )
          manifest_version = manifest["version"]

          if manifest_version != tag_version:
              raise SystemExit(
                  f"manifest version '{manifest_version}' does not match tag '{tag_version}'"
              )
          PY

  build-release-archive:
    runs-on: ubuntu-latest
    needs:
      - validate-version
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize release tag input
        run: |
          if [[ "${RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}"
          elif [[ "${RELEASE_TAG}" =~ ^v\.([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}"
            echo "::warning::Tag '${RELEASE_TAG}' uses legacy malformed format 'v.X.Y.Z'."
            echo "::warning::Prefer creating tags as 'vX.Y.Z'."
          elif [[ "${RELEASE_TAG}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}"
            RELEASE_TAG="v${RELEASE_VERSION}"
            echo "Normalized release tag to '${RELEASE_TAG}'"
          else
            echo "::error::Unsupported tag format '${RELEASE_TAG}'."
            echo "::error::Use tag format vX.Y.Z or X.Y.Z (example: v1.1.1)."
            exit 1
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Ensure requested release tag exists
        run: |
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git fetch --tags origin
          fi
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Tag '${RELEASE_TAG}' not found in origin."
            echo "::error::Create/push the tag first or select an existing tag in Run workflow."
            exit 1
          fi

      - name: Checkout requested release tag
        run: |
          git checkout --force "refs/tags/${RELEASE_TAG}"

      - name: Sync release files from tag version
        run: |
          python scripts/release_bump.py "${RELEASE_VERSION}"

      - name: Build HACS release archive
        run: |
          mkdir -p dist
          cd custom_components
          zip -r "../dist/ha_simple_mcp.zip" "ha_simple_mcp"

      - name: Publish HACS archive as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/ha_simple_mcp.zip
          generate_release_notes: true
          append_body: true
