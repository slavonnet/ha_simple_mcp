name: Release PR Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

jobs:
  auto-bump-release-version:
    if: startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse release branch version
        id: release_version
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          target_version="${GITHUB_HEAD_REF#release/}"
          if [[ ! "${target_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release branch must match release/<semver>, got ${GITHUB_HEAD_REF}"
            exit 1
          fi
          echo "target_version=${target_version}" >> "$GITHUB_OUTPUT"

      - name: Run release bump script
        run: |
          python scripts/release_bump.py "${{ steps.release_version.outputs.target_version }}"

      - name: Commit and push auto-bump changes
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "Release metadata is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ha_simple_mcp/manifest.json
          git commit -m "chore: auto-sync release metadata for v${{ steps.release_version.outputs.target_version }}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  validate-release-version-bump:
    if: startsWith(github.head_ref, 'release/')
    needs:
      - auto-bump-release-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release PR version bump
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path

          import tomllib

          head_branch = os.environ.get("GITHUB_HEAD_REF", "")
          if not head_branch.startswith("release/"):
              raise SystemExit(f"Release PR check expects release/* branch, got {head_branch}")

          suffix = head_branch.split("/", 1)[1]
          if not re.fullmatch(r"\d+\.\d+\.\d+", suffix):
              raise SystemExit(
                  f"Release branch must match release/<semver>, got release/{suffix}"
              )
          target_version = suffix

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          dynamic_version_enabled = "version" in pyproject["project"].get("dynamic", [])
          project_version = pyproject["project"].get("version")
          manifest = json.loads(
              Path("custom_components/ha_simple_mcp/manifest.json").read_text(encoding="utf-8")
          )
          manifest_version = manifest["version"]
          if dynamic_version_enabled:
              if "version" in pyproject["project"]:
                  raise SystemExit(
                      "project.version must be omitted when setuptools_scm dynamic versioning is enabled"
                  )
          else:
              if project_version != target_version:
                  raise SystemExit(
                      f"pyproject version '{project_version}' must equal release version '{target_version}'"
                  )
          if manifest_version != target_version:
              raise SystemExit(
                  f"manifest version '{manifest_version}' must equal release version '{target_version}'"
              )
          PY
