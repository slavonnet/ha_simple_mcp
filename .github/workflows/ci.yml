name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[test]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src custom_components tests

      - name: Test with coverage gate
        run: python -m pytest -q --cov=src/ha_simple_mcp --cov=custom_components --cov-branch --cov-fail-under=100 --cov-report=term-missing
